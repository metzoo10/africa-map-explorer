  <!-- Main Layout -->
  <main class="main-content">
    <!-- Composant Carte SVG -->
    <app-africa-map 
      [selectedCountryId]="selectedCountry?.id || null"
      (countrySelected)="selectCountry($event)">
    </app-africa-map>

    <!-- Panneau latéral dynamique -->
     @if (selectedCountry) {
      <div class="backdrop" (click)="selectedCountry = null"></div>
     }

    <app-pays-detail 
      *ngIf="selectedCountry"
      [country]="selectedCountry" 
      (close)="selectedCountry = null">
    </app-pays-detail>
  </main>
</div>
